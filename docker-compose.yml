version: '3.8'

services:
  interview-test:
    build: .
    container_name: ai_interview_auto_test

    # 环境变量（覆盖数据库配置等）
    environment:
      - DB_HOST=${DB_HOST:-10.11.150.253}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-Qwe123!!}
      - DB_DATABASE=${DB_DATABASE:-ry-vue-py}
      - BASE_URL=${BASE_URL:-https://58.60.153.86:57070}

    # 挂载卷（保存日志和截图 + wav 文件）
    volumes:
      - ./logs:/app/logs
      - ./screenshots:/app/screenshots
      - ./videos:/app/videos
      - ./traces:/app/traces
      - ./wav:/app/wav:ro  # 只读挂载音频/视频文件（需要在宿主机有 wav 文件）

    # 网络配置
    networks:
      - test-network

    # 重启策略（Jenkins 用）
    restart: "no"

networks:
  test-network:
    driver: bridge
